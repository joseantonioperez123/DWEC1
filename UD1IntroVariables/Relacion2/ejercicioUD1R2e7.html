<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UD1 - Relación 2 - Ejercicio 7</title>
</head>
<body>
    <h1>UD1 - Relación 2 (días de la semana) - Ejercicio 7</h1>
    <p>RECUERDA: mira la consola</p>
    <p id="resultado"></p>
</body>
    <script>
        let dia = prompt("Introduce número del 1 al 7: ");
        let diaN = parseInt(dia);
        switch ( diaN ) {
            case 1: console.log("lunes");
                break;
            case 2: console.log("martes");
                break;
            case 3: console.log("miércoles");
                break;
            case 4: console.log("jueves");
                break;
            case 5: console.log("viernes");
                break;
            case 6: console.log("sábado");
                break;
            case 7: console.log("domingo");
                break;
            default: console.log("Teclea un número entre 1 y 7");
        }
    </script>

</html>
