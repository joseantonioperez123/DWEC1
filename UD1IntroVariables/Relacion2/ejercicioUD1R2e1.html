<!DOCTYPE html>
<html lang="en">

<body>
    <h1>UD1 - Relación 2 (if+switch) - Ejercicio 1</h1>
    <p>RECUERDA: mira la consola</p>

    <script>
        let x = prompt("Introduce un número: ");
        if ( x < 0 )
            console.log(x + " es negativo");
        else if ( x > 0 )
            console.log(x + " es positivo");
        else
            console.log(x + " es CERO");
    </script>
</body>
