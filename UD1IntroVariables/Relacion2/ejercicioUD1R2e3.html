<!DOCTYPE html>

<body>
    <h1>UD1 - Relación 2 (número par o impar) - Ejercicio 3</h1>
    <p>RECUERDA: mira la consola</p>

    <script>
        let x = prompt( "Introduce un número: ", 0 );
        if ( x % 2 )
            console.log(x + " es impar");
        else
            console.log(x + " es par");
    </script>
