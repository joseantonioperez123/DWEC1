<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let filas = prompt("¿De cuántas filas quieres la tabla? ");
        let columnas = prompt("¿De cuántas columnas quieres la tabla? ");
        let ancho = prompt("¿De cuántos píxeles de ancho quieres las celdas? ");
        let alto = prompt("¿De cuántos píxeles de alto quieres las celdas");
        document.write('<table border="0" cellspacing="2" bgcolor= "black" width="200">');
        for (let i=0; i<filas; i++) {
            document.write("<tr bgcolor='white' height='"+alto+"'>");
            for ( let j=0; j<columnas; j++) {
                document.write(`<td width='${ancho}'></td>`);
            }
            document.write("</tr>");
        }
        document.write("</table>");
    </script>
</body>
</html>
