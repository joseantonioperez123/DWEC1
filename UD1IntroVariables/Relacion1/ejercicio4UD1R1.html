<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UD1 - Relación 1 - Ejercicio 4</title>
</head>
<body>
    <h1>UD1 - Relación 1 - Ejercicio 4</h1>
    <p>Constantes y constantes objeto</p>
    <script>
        {
            var x=10;
        }
        {
            let x=12;
            console.log("X definido con LET: "+ x);
            let y=20;
        }
        console.log("X definido antes con VAR: " + x);
        try {
            console.log("Y="+y);   
        } catch (error) {
            console.log(error);
        }
        console.log("FIN DE PROGRAMA");
</script>
</body>
</html>
