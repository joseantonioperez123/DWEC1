<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOLOCALIZACION</title>
    <style>
        #map { height: 180px; }
    </style>
    <!-- leaflet map -->
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
     <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
</head>
<body>
    <div id="map"></div>
    <script>
        function mostrarPosicion ( pos ) {
            console.log ( pos );
            console.log(pos.coords.latitude);
            //document.write(pos.coords.latitude+ " "+
            //                pos.coords.longitude+ "<br>");
            var map = L.map('map').setView([pos.coords.latitude, pos.coords.longitude], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
        var marca = L.marker([pos.coords.latitude, pos.coords.longitude]).addTo(map);
        }

        console.log(navigator.geolocation);
        
        //navigator.geolocation.getCurrentPosition(mostrarPosicion);
        navigator.geolocation.watchPosition(mostrarPosicion);

        //var map = L.map('map').setView([36.7457, -3.953], 13);

        }).addTo(map);*/
    </script>
</body>
</html>
