<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Object Model</title>
    <style>
        #mi-barra-estado {
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%;
            background-color: #f1f1f1;
            padding: 5px;
            border-top: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div>
        <button id="abrirPagina">
            Abrir Jorge Guillén
        </button>
        <button id="abrirBOMhijo">
            Abrir BOMhijo.html
        </button>
    </div>
    <div>
        <button id="llamarHijo">Mensaje a hijo</button>
        <button id="irAHijo">Volver a ventana hija</button>
    </div>
    <p id="infoVentana"></p>
    <div id="mi-barra-estado">
                Listo
    </div>
    <script>
        /*let respuesta = confirm("Aceptar?:");

            alert("Has pulsado ACEPTAR");

        */
        // abrir una nueva ventana
        let ventana;
        let estado = document.getElementById("mi-barra-estado");
        btn = document.getElementById("abrirPagina").addEventListener (
            "click", function () {
                if ( ventana == undefined ) {
                    ventana = window.open("https://www.iesjorgeguillen.es","IES");
                    estado.innerHTML = "VENTANA ABIERTA";
                    btn1 = document.getElementById("abrirPagina");
                    btn1.innerHTML = "CERRAR VENTANA";
                }
                else {
                    estado.innerHTML = "VENTANA CERRADA";
                    btn1 = document.getElementById("abrirPagina");
                    btn1.innerHTML = "ABRIR VENTANA";
                    ventana.close();
                    ventana = undefined;
                }
            }
        );

        function comprobarVentana() {
            let p = document.getElementById("infoVentana");
            if ( ventana != undefined )
                if ( ventana.closed ) {
                    //p.innerHTML = "Se ha cerrado la ventana";
                    estado.innerHTML = "VENTANA CERRADA";
                                        estado.innerHTML = "VENTANA CERRADA";
                    btn1 = document.getElementById("abrirPagina");
                    btn1.innerHTML = "ABRIR VENTANA";
                    ventana = undefined;
                }
        }

        setInterval(comprobarVentana, 500);

        // Comunicación entre ventana padre e hija
        btnHijo = document.getElementById("abrirBOMhijo");
        btnHijo.addEventListener("click", abreHijo);
        let ventanaHija;
        function abreHijo() {
            //ventanaHija = window.open("BOMhijo.html", "VentanaHija", "width=400,height=300");
            ventanaHija = window.open("BOMhijo.html", "VentanaHija");
        }
        
        function enElPadre(mensaje)
        {
            console.log(mensaje);
            
        }
        btnLlamarHijo = document.getElementById("llamarHijo");
        btnLlamarHijo.addEventListener("click", llamarHijo);
        function llamarHijo() {
            if ( ventanaHija && !ventanaHija.closed )
                ventanaHija.enElHijo("Mensaje desde el padre", 6);
            else
                alert("La ventana hija no está abierta");
        }
        btnIaAHijo = document.getElementById("irAHijo");
        btnIaAHijo.addEventListener("click", () => {
            if ( ventanaHija && !ventanaHija.closed )
                ventanaHija.focus();
        });
    </script>
</body>
</html>
