<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Post-it Interactiva</title>
    <style>
        /* Estilos de la mesa de trabajo */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Fondo que simula una mesa de madera oscura */
            background-color: #2c1d11;
            background-image: radial-gradient(rgba(0,0,0,0.3) 15%, transparent 80%),
                              linear-gradient(to right, #3a2717 1px, transparent 1px);
            background-size: 100% 100%, 50px 100%;
            height: 100vh;
            width: 100vw;
        }

        /* Barra superior para controles */
        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        button {
            background-color: #ffeb3b;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border-radius: 4px;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Estilo base de los Post-it */
        .post-it {
            width: 150px;
            height: 150px;
            padding: 15px;
            position: absolute;
            background-color: #fff799;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.4);
            cursor: move;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-size: 16px;
            border-left: 1px solid rgba(0,0,0,0.05);
            /* Ligera rotación aleatoria inicial mediante JS */
            transform: rotate(-1deg);
            display: flex;
            flex-direction: column;
        }

        /* Zona de arrastre/cabecera del Post-it */
        .post-it-header {
            height: 20px;
            margin-top: -10px;
            margin-bottom: 5px;
            border-bottom: 1px dashed rgba(0,0,0,0.1);
        }

        /* Área de texto editable */
        .post-it-content {
            flex-grow: 1;
            border: none;
            background: transparent;
            resize: none;
            outline: none;
            font-family: inherit;
            font-size: inherit;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="controls">
        <button onclick="createPostIt()">+ Añadir Post-it</button>
    </div>

    <script>
        // Colores típicos de Post-it para alternar aleatoriamente
        const colors = ['#fff799', '#ff7eb9', '#7afcff', '#feff9c', '#fff799'];
        let zIndexCounter = 1;

        function createPostIt() {
            // 1. Crear el elemento contenedor
            const postIt = document.createElement('div');
            postIt.className = 'post-it';
            
            // Posición inicial aleatoria en la pantalla
            const randomX = Math.random() * (window.innerWidth - 200) + 50;
            const randomY = Math.random() * (window.innerHeight - 250) + 100;
            postIt.style.left = `${randomX}px`;
            postIt.style.top = `${randomY}px`;
            
            // Color y rotación sutil aleatoria para realismo
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const randomAngle = (Math.random() * 6) - 3; // Entre -3 y 3 grados
            postIt.style.backgroundColor = randomColor;
            postIt.style.transform = `rotate(${randomAngle}deg)`;
            
            // Traer al frente el último creado
            zIndexCounter++;
            postIt.style.zIndex = zIndexCounter;

            // 2. Estructura interna (cabecera para arrastrar y text-area para escribir)
            postIt.innerHTML = `
                <div class="post-it-header"></div>
                <textarea class="post-it-content" placeholder="Escribe algo..."></textarea>
            `;

            // 3. Añadir el evento para arrastrar (Drag)
            makeDraggable(postIt);

            // 4. Meterlo en la mesa (body)
            document.body.appendChild(postIt);
        }

        function makeDraggable(element) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

            // Evento cuando se hace clic con el ratón
            element.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                e = e || window.event;
                // Si hace clic en el textarea para escribir, no arrastra inmediatamente
                if (e.target.className === 'post-it-content') {
                    // Solo pasamos al frente
                    element.style.zIndex = ++zIndexCounter;
                    return;
                }
                
                e.preventDefault();
                
                // Traer al frente al hacer clic para arrastrar
                element.style.zIndex = ++zIndexCounter;
                
                // Obtener la posición inicial del cursor
                pos3 = e.clientX;
                pos4 = e.clientY;
                
                // Eventos cuando se mueve el ratón o se suelta el botón
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                
                // Calcular las nuevas coordenadas del cursor
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                
                // Fijar la nueva posición del elemento en la pantalla
                element.style.top = (element.offsetTop - pos2) + "px";
                element.style.left = (element.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                // Detener el movimiento cuando se suelta el botón del ratón
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        // Crear un primer Post-it de bienvenida automáticamente al cargar la página
        window.onload = createPostIt;
    </script>
</body>
</html>
