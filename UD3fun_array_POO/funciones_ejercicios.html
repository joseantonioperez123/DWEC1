        // 1. funciones anónimas y asignación a variables
        const operacion = function (a, b) {
            return a * 2 + b;
        };
        console.log(operacion(3, 4));
        console.log(typeof operacion);

        // 2. funciones tradicionales y función flecha
        function calcular(a, b) {
            return a + b;
        }
        const calcularFlecha = (a, b) => a + b;
        console.log(calcular(5, 3));
        console.log(calcularFlecha(5, 3));

        // 3. parámetros por defecto
        function presentar(nombre = "Invitado", edad = 18) {
            console.log("Nombre: " + nombre);
            console.log("Edad: " + edad);
        }
        presentar("Laura", 25);
        presentar("Pedro");
        presentar();
        presentar(undefined, 30);
        presentar(null, 20);

        // 4. objeto arguments
        function mostrarDatos(a, b) {
            console.log("Primer parámetro:", a);
            console.log("Segundo parámetro:", b);
            console.log("Número de argumentos:", arguments.length);
            console.log("Tercer argumento:", arguments[2]);
        }
        mostrarDatos(10, 20, 30);
        mostrarDatos(5);

        // 5. parámetro rest (...theRest)
        function sumar(primerNumero, ...theRest) {
            let total = primerNumero;
            for (let numero of theRest) {
                total += numero;
            }
            return total;
        }
        console.log(sumar(10));
        console.log(sumar(10, 20));
        console.log(sumar(10, 20, 30, 40));
